<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="titanium" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0%"  stop-color="#5b5c60"/>
      <stop offset="20%" stop-color="#8d8e92"/>
      <stop offset="40%" stop-color="#d6d7da"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d6d7da"/>
      <stop offset="80%" stop-color="#8d8e92"/>
      <stop offset="100%" stop-color="#5b5c60"/>
      <animate attributeName="x1" from="-300" to="900" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0" to="1200" dur="3.4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="200" fill="#000000"/>

  <text x="450" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="4"
        fill="url(#titanium)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.6" paint-order="stroke" filter="url(#softGlow)">
    SAKSHAM SINHA
  </text>

  <text x="450" y="140" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-weight="500" font-size="14" letter-spacing="1.2" fill="#9a9a9e">
    AGENTIC AI ARCHITECT &#183; LLM ORCHESTRATION &#183; AUTONOMOUS MULTI-AGENT SYSTEMS
  </text>
</svg>
